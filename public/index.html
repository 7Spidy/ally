<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ally</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0910;
      color: #f4efe6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: #9a92a6;
      font-size: 15px;
      max-width: 280px;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .retry-btn {
      background-color: #f4efe6;
      color: #0a0910;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .retry-btn:active {
      opacity: 0.8;
    }
    @keyframes pulse {
      0% { opacity: 0.8; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.8; transform: scale(0.98); }
    }
  </style>
</head>
<body>
  <img src="assets/logo/ally-logo.png" alt="Ally" class="logo" onerror="this.style.display='none'">
  <h1>Ally</h1>
  <p>Connecting to companion services...</p>
  <button class="retry-btn" onclick="window.location.href='https://ally.redream.in'">Retry</button>
  <script>
    // If online, immediately redirect to production
    if (navigator.onLine) {
      window.location.replace("https://ally.redream.in");
    }
    window.addEventListener("online", () => {
      window.location.replace("https://ally.redream.in");
    });
  </script>
</body>
</html>
