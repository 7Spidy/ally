<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#FFFFFF;">
  <div style="max-width:480px;margin:0 auto;padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2B2B2B;">
    <p style="margin:0 0 24px;font-size:16px;letter-spacing:2px;color:#B8923A;">ALLY</p>
    <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;font-weight:500;color:#2B2B2B;">Your code to log in to Ally</h1>
    <div style="border-top:2px solid #B8923A;width:48px;margin:0 0 24px;"></div>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#2B2B2B;">Enter this code in Ally.</p>
    <p style="margin:0 0 16px;font-size:32px;letter-spacing:8px;font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;color:#2B2B2B;">{{ .Token }}</p>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#6F8A68;">This code is valid for 10 minutes.</p>
    <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/home" style="display:inline-block;padding:12px 24px;background:#B8923A;color:#FFFFFF;font-size:16px;text-decoration:none;border-radius:8px;">Or tap to continue</a></p>
    <p style="margin:0;font-size:16px;line-height:1.5;color:#6F8A68;">Didn't ask for this? You can safely ignore this email.</p>
  </div>
</body>
</html>
